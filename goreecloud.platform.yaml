schema_version: '0.3'
component:
  type: application
  id: goreecloud-music
  product_name: GoreeCloud Music
  repository: GoreeCloud/goreecloud-music
lifecycle: development
version: '0.1.0-dev.1'
supported_platforms:
  - web
  - android
  - linux
api:
  versions: []
  endpoints: []
platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - FEATURE-ROADMAP.md
    notes: Manager observability and administration are planned; no accepted runtime Manager integration is established.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - PRIVACY POLICY.md
      - SPECIFICATIONS.md
    notes: Privacy requirements are documented, but Privacy Shield runtime authorization and acceptance are not implemented or accepted.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SECURITY.md
      - SPECIFICATIONS.md
    notes: Security requirements are documented, but Wardveil Security runtime integration and acceptance are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - FEATURE-ROADMAP.md
    notes: Backup, restore, preservation, portability, and recovery verification remain implementation obligations.
  glaze_ui:
    result: applicable-blocked
    version: null
    evidence:
      - BRANDING.md
      - SPECIFICATIONS.md
    notes: Current Stable Glaze UI 1.4.1 is required for graphical clients; no Music client conformance or acceptance is established.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: No runtime GoreeCloud Mesh capabilities, dependencies, events, or acceptance are implemented.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - SECURITY.md
    notes: Account, profile, session, device, and authorization integration are planned; no GoreeCloud Identity runtime acceptance is established.
  sync:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - FEATURE-ROADMAP.md
    notes: Cross-device progress, queues, preferences, playlists, and other authorized Music state are planned to synchronize, but no accepted GoreeCloud Sync dataset contract or runtime reconciliation evidence is established.
health:
  health_endpoint: null
  readiness_endpoint: null
continuity:
  backup:
    required: true
    requirements:
      - Protect durable application state through an accepted Everkeep-aligned backup path before production dependence.
  restore:
    required: true
    requirements:
      - Verify restoration, integrity, authorization, privacy boundaries, and original-media independence before recovery-ready claims.
  export:
    required: true
    requirements:
      - Provide user-controlled portable export for supported Music metadata and application state.
  portability:
    required: true
    requirements:
      - Preserve original media independently and use documented portable metadata and state formats where practical.
external_dependencies: []
compatibility:
  platform_contract: '0.3'
  glaze_ui_required: '1.4.1'
  requires:
    - goreecloud-platform-contract==0.3
    - glaze-ui==1.4.1
  provides:
    - goreecloud-music-development-foundation
evidence:
  acceptance_tests: []
  release: []
conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - FEATURES.md
    - FEATURE-ROADMAP.md
    - PRIVACY POLICY.md
    - SECURITY.md
  blockers:
    - Executable Music application or service implementation and automated test evidence are not yet established by this repository baseline.
    - Runtime integrations for Manager, Privacy Shield, Wardveil Security, Everkeep, Glaze UI, Mesh, Identity, and Sync are not accepted.
    - Supported client builds, accessibility validation, packaging, deployment, recovery, release, and production evidence are not established.
